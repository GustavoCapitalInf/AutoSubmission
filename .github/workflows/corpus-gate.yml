name: Corpus gate

# Required before merge. Re-runs both independent forensic oracles over all 109
# corpus statements and fails red on any drift from the committed audits.
#
# The GATE is deliberately offline: no OCR endpoint, no Gemini key, no
# Tesseract. The six image-only statements are served from committed OCR
# artifacts, so `corpus_gate.py` needs nothing but the repository and the
# analysis dependencies.
#
# The DEFAULT TEST SUITE, which runs in the same job, is a different story: it
# exercises the real local OCR ladder (poppler page counts, and two scanned
# fixtures re-OCR'd with tesseract). Those binaries are not on the runner image
# by default — see the system-dependency step below.
#
# CI-1 history (2026-08-06):
#   * run 31122891522 (push) never reached a step: "The job was not acquired by
#     Runner of type hosted even after multiple attempts", job cancelled after
#     15m with an empty runner_name. Transient hosted-runner acquisition, not
#     workflow content and not billing: run 31128260273 (workflow_dispatch, same
#     workflow, same `ubuntu-latest` label, ~3.5h later) picked up a runner in
#     seconds and executed every step. Nothing to fix here; if it recurs, re-run
#     the job and check https://www.githubstatus.com.
#   * run 31128260273 then failed in "Default test suite" with 10 failures, all
#     missing system binaries (PDFInfoNotInstalledError; parse_local_tesseract
#     returning None). Fixed by the system-dependency step below.
#
# HYG-01 history (audit 2026-10-13): from 2026-09-22 every run stopped at test
# collection, because the suite imported packages this job did not install
# (jsonschema, pypdfium2, numpy, all three through the retired visual pair
# under vlm/), and the gate step, which ran only after a green suite, was
# skipped on every run. The visual pair and the three packages left with the
# model-code removal (2026-10), so requirements-dev.txt adds only pytest; a
# runtime-only import check guards the gap that opens between this job and the
# hosting image and fails when a model module loads; and the gate runs
# whatever the suite's result.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  corpus-gate:
    # Pinned rather than `ubuntu-latest`, which moves to Ubuntu 26 from
    # 2026-10-19 (the runner's own notice): a new image brings a new tesseract,
    # and tesseract drift can move OCR-derived assertions (see the OCR step).
    # Move this pin deliberately, with a green run on the new image.
    runs-on: ubuntu-24.04
    # The suite (about 25,000 tests) and the gate (13-15 min when last green)
    # no longer fit the old 30 minutes; this is a ceiling for a hung run, not
    # an expected duration.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-analysis.txt
            requirements-dev.txt

      - name: Install OCR system dependencies
        # poppler-utils: `ocr.rasterize.pdf_page_count` shells out to pdfinfo.
        # tesseract-ocr: two scanned fixtures in tests/test_new_statement_corpus.py
        # are re-OCR'd live. Version drift between this runner and a developer
        # box can move OCR-derived assertions; if that happens, the fix is to
        # serve those two fixtures from the committed artifact cache (as the
        # gate already does), not to deselect the tests.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
          pdfinfo -v
          tesseract --version

      - name: Install runtime dependencies
        # Exactly what the hosting image installs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-analysis.txt

      - name: Import the shipped entry points with the runtime dependencies only
        # Before the test-only packages go in, so a new top-level import that
        # the two runtime files do not cover fails here rather than on the
        # hosting image. The web app opens its store at import, so it gets a
        # scratch data folder outside the checkout. The product uses no model
        # (owner ruling 2026-10-13), so the step also fails when importing the
        # entry points loaded a model package or the removed visual pair; the
        # list is pinned equal to tests/test_no_model_clients.py's.
        env:
          WEBAPP_DATA_DIR: ${{ runner.temp }}/import-check-data
        run: |
          python - <<'EOF'
          import sys
          import webapp.app, webapp.worker, analyze, batch, parse, corpus_gate, discovery.runner, discovery.cli
          import telemetry.run_of_record, telemetry.stated_counts, tools.train.provenance
          BANNED = (
              "openai", "google.genai", "google.generativeai", "paddleocr", "paddle", "vllm", "transformers",
              "torch", "torchvision", "accelerate", "peft", "einops", "huggingface_hub", "anthropic", "vlm",
          )
          loaded = sorted(m for m in sys.modules if any(m == b or m.startswith(b + ".") for b in BANNED))
          if loaded:
              sys.exit("a model module was imported: " + ", ".join(loaded))
          print("entry points imported; no model module loaded")
          EOF

      - name: Install test dependencies
        # pytest, the one test-only package (the suite needs nothing else since
        # the visual pair's jsonschema, pypdfium2 and numpy left with it).
        run: pip install -r requirements-dev.txt

      - name: Verify the corpus checked out byte-identically
        # .gitattributes marks PDFs binary. If that ever regresses, the pinned
        # SHA-256s stop reproducing and every later step is meaningless.
        id: corpus_bytes
        run: python -c "import corpus_gate, sys; r = corpus_gate.Result(); corpus_gate.check_source_integrity(r, corpus_gate.CORPUS, corpus_gate.read_csv(corpus_gate.BALANCE_CSV)); print(r.checks[0].summary); sys.exit(0 if r.ok else 1)"

      - name: Default test suite
        run: python -m pytest -q

      - name: Corpus gate
        # Runs whether or not the suite passed, so a red unit test cannot hide
        # the gate's verdict; the job still fails when either step fails, so
        # nothing is weakened. It does not run when the corpus failed its byte
        # check above, because then its verdict means nothing.
        if: ${{ !cancelled() && steps.corpus_bytes.outcome == 'success' }}
        run: python corpus_gate.py --json corpus-gate-report.json

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-gate-report
          path: corpus-gate-report.json
