name: fly-deploy

# Deploys the intern tryout (https://bank-statement-tryout.fly.dev) whenever the
# hosting branch changes. The image is built on Fly's remote builder from the
# repository Dockerfile; .dockerignore keeps Bank Statements/ out of it.
# FLY_API_TOKEN is an app-scoped deploy token (fly tokens create deploy).

on:
  push:
    branches:
      - cursor/intern-testing-host-d911
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --app bank-statement-tryout
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
