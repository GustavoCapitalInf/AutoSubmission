name: Lender matching

# The fixtures test reads the analysis API schema, so a change to it runs this workflow too.
on:
  pull_request:
    paths:
      - "packages/lender_matching/**"
      - "packages/bank_statement_analysis/docs/api/v1.schema.json"
      - ".github/workflows/lender-matching.yml"
  push:
    branches: [main]
    paths:
      - "packages/lender_matching/**"
      - "packages/bank_statement_analysis/docs/api/v1.schema.json"
      - ".github/workflows/lender-matching.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/lender_matching
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain with rustfmt and clippy
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/lender_matching

      - name: Fetch and verify pdfium
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) target=linux-x64 ;;
            Windows) target=win-x64 ;;
            *) echo "no pdfium target for $RUNNER_OS"; exit 1 ;;
          esac
          read -r url sha <<<"$(awk -v target="$target" '$1 !~ /^#/ && $2 == target { print $3, $4 }' pdfium.lock)"
          test -n "$url" && test -n "$sha"
          root="$RUNNER_TEMP/pdfium"
          if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -u "$RUNNER_TEMP")/pdfium"; fi
          mkdir -p "$root"
          curl --fail --silent --show-error --location "$url" --output "$root/pdfium.tgz"
          (cd "$root" && echo "$sha  pdfium.tgz" | sha256sum --check - && tar -xzf pdfium.tgz)
          if [ "$RUNNER_OS" = Windows ]; then file="$root/bin/pdfium.dll"; else file="$root/lib/libpdfium.so"; fi
          test -f "$file"
          library="$file"
          if [ "$RUNNER_OS" = Windows ]; then library="$(cygpath -w "$file")"; fi
          echo "PDFIUM_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "PDFIUM_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
