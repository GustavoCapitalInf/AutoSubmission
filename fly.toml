# Fly.io config for the intern tryout (https://bank-statement-tryout.fly.dev).
# Saved from the running app's config on 2026-09-22 so deploys are reproducible;
# .github/workflows/fly-deploy.yml deploys it on every push to this branch.
# Secrets (WEBAPP_AUTH_USER, WEBAPP_AUTH_PASSWORD) live in Fly, never here.
# The volume keeps uploads, analyses, revenue review decisions and settings
# across idle stops and deploys (without it every stop wiped them). It is
# mounted outside the checkout (/app), where the app refuses to keep customer
# data; the same volume moved from /app/webapp_data to /data with its contents.

app = "bank-statement-tryout"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  WEBAPP_DATA_DIR = "/data"
  WEBAPP_HOST = "0.0.0.0"
  WEBAPP_PORT = "5000"

[mounts]
  source = "webapp_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
