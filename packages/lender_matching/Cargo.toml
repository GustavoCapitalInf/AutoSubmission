[workspace]
members = [".", "wire"]
resolver = "3"

[package]
name = "lender-matching"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "form", "json", "matched-path", "original-uri"] }
base64 = "0.23.1"
calamine = "0.37.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
lender_matching_wire = { version = "0.1.0", path = "wire" }
maud = { version = "0.27.0", features = ["axum"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "process", "io-util"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
rust_xlsxwriter = "0.101.0"
