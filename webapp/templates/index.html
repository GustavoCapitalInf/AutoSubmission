<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unlimited-OCR - Bank Statement Parser</title>
<style>
  :root {
    --bg: #0e0e11; --panel: #151519; --panel-2: #1b1b21; --border: #2a2a31;
    --text: #e6e6ea; --muted: #8b8b95; --accent: #7c5cff; --accent-2: #23c4a8;
    --ok: #2ea043; --warn: #c9a227; --err: #e5534b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); display: flex; flex-direction: column;
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .toolbar { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem;
             background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .wordmark { font-weight: 700; letter-spacing: .02em; font-size: 1.05rem; margin-right: .5rem; }
  .wordmark .u { color: var(--accent); }
  .wordmark .o { color: var(--accent-2); }
  .btn { border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
         padding: .42rem .8rem; border-radius: 7px; font-size: .85rem; cursor: pointer;
         transition: .15s; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: default; }
  select.btn { appearance: none; padding-right: 1.6rem;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238b8b95'/></svg>");
    background-repeat: no-repeat; background-position: right .6rem center; }
  .spacer { flex: 1; }
  .pill { font-size: .78rem; padding: .3rem .6rem; border-radius: 999px; font-weight: 600;
          border: 1px solid var(--border); color: var(--muted); }
  .pill.processing, .pill.queued { color: var(--warn); border-color: var(--warn); }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  .pill.error { color: var(--err); border-color: var(--err); }

  .panels { flex: 1; display: grid; grid-template-columns: 1.1fr .9fr .95fr 1.05fr; min-height: 0; position: relative; }
  .panel { min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .panel:last-child { border-right: 0; }
  .panel-head { flex: 0 0 auto; padding: .5rem .9rem; font-size: .72rem; letter-spacing: .12em;
                text-transform: uppercase; color: var(--muted); background: var(--panel);
                border-bottom: 1px solid var(--border); }
  .panel-head .k { color: var(--accent); }
  .panel-body { flex: 1; overflow: auto; }

  #doc { background: #33343a; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; align-items: center; }
  .page-wrap { position: relative; width: 100%; max-width: 780px; }
  .page-wrap img { width: 100%; display: block; background: #fff; border-radius: 4px;
                   box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .box { position: absolute; border: 2px solid; box-sizing: border-box; pointer-events: none;
         border-radius: 2px; transition: opacity .2s; }
  .box-label { position: absolute; top: -13px; left: -2px; font-size: 9px; line-height: 12px;
               color: #111; padding: 0 3px; border-radius: 2px 2px 0 0; white-space: nowrap;
               font-weight: 600; }
  #doc.hide-boxes .box { display: none; }

  #source { margin: 0; padding: 1rem 1.1rem; white-space: pre-wrap; word-break: break-word;
            font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-size: .82rem;
            line-height: 1.5; color: #c8cdd6; }

  #rendered { width: 100%; height: 100%; border: 0; background: #fff; }

  #analysis { padding: .9rem; display: flex; flex-direction: column; gap: .85rem; background: #101014; }
  .analysis-banner { border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
                     padding: .8rem; display: grid; gap: .3rem; }
  .analysis-banner.approved { border-color: rgba(46,160,67,.75); }
  .analysis-banner.summary_only { border-color: rgba(201,162,39,.8); }
  .analysis-banner.manual_review_required, .analysis-banner.error { border-color: rgba(229,83,75,.8); }
  .quality-line { display: flex; align-items: center; justify-content: space-between; gap: .75rem; }
  .quality-title { font-size: .95rem; font-weight: 700; }
  .quality-chip { flex: 0 0 auto; border: 1px solid var(--border); border-radius: 999px; padding: .22rem .55rem;
                  font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .analysis-banner.approved .quality-chip { color: var(--ok); border-color: var(--ok); }
  .analysis-banner.summary_only .quality-chip { color: var(--warn); border-color: var(--warn); }
  .analysis-banner.manual_review_required .quality-chip, .analysis-banner.error .quality-chip {
    color: var(--err); border-color: var(--err);
  }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
  .metric-card { min-width: 0; border: 1px solid var(--border); background: var(--panel);
                 border-radius: 8px; padding: .65rem; }
  .metric-label { color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; }
  .metric-value { margin-top: .18rem; font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
  .metric-sub { margin-top: .18rem; color: var(--muted); font-size: .72rem; line-height: 1.35; }
  .analysis-section { border: 1px solid var(--border); background: var(--panel); border-radius: 8px; overflow: hidden; }
  .section-title { padding: .55rem .65rem; border-bottom: 1px solid var(--border); color: var(--muted);
                   font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; }
  .kv { display: grid; grid-template-columns: minmax(7rem, .85fr) 1fr; gap: .45rem .7rem; padding: .65rem; font-size: .82rem; }
  .kv .key { color: var(--muted); }
  .kv .value { min-width: 0; overflow-wrap: anywhere; }
  .issue-list, .detection-list { list-style: none; margin: 0; padding: .65rem; display: grid; gap: .45rem; }
  .issue-list li, .detection-list li { border-left: 3px solid var(--warn); padding-left: .55rem;
                                       color: #d7d7de; font-size: .78rem; line-height: 1.35; }
  .detection-list li { border-left-color: var(--accent-2); }
  .analysis-empty { color: var(--muted); padding: 2rem 1rem; text-align: center; font-size: .9rem; }

  @media (max-width: 1250px) {
    .panels { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .panel:nth-child(2n) { border-right: 0; }
    .panel:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
  }
  @media (max-width: 760px) {
    .toolbar { flex-wrap: wrap; }
    .panels { grid-template-columns: 1fr; grid-template-rows: repeat(4, minmax(28rem, 1fr)); }
    .panel { border-right: 0; border-bottom: 1px solid var(--border); }
  }

  .placeholder { color: var(--muted); padding: 2rem; text-align: center; font-size: .9rem; }
  #drophint { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
              background: rgba(124,92,255,.12); border: 2px dashed var(--accent); font-size: 1.1rem;
              color: var(--accent); pointer-events: none; z-index: 5; }
  body.drag #drophint { display: flex; }
</style>
</head>
<body>
  <div class="toolbar">
    <span class="wordmark"><span class="u">Unlimited</span>-<span class="o">OCR</span></span>
    <button class="btn primary" id="uploadBtn">Upload PDFs</button>
    <input type="file" id="fileInput" multiple accept="application/pdf" style="display:none">
    <select class="btn" id="docSelect" title="Document"><option value="">No documents</option></select>
    <label class="btn" style="display:flex;align-items:center;gap:.4rem;">
      <input type="checkbox" id="boxToggle" checked> Boxes
    </label>
    <label class="btn" style="display:flex;align-items:center;gap:.4rem;">
      <input type="checkbox" id="renderBoxToggle" checked> Render boxes
    </label>
    <label class="btn" style="display:flex;align-items:center;gap:.4rem;" title="Bypass native PDF text and send pages through visual OCR.">
      <input type="checkbox" id="forceOcrToggle"> Force visual OCR
    </label>
    <span class="pill" id="modePill">mode: auto</span>
    <span class="spacer"></span>
    <button class="btn" id="dlMd" disabled>Download .md</button>
    <button class="btn" id="dlHtml" disabled>Download .html</button>
    <button class="btn" id="dlJson" disabled>Download .json</button>
    <span class="pill" id="statusPill">idle</span>
  </div>

  <div class="panels">
    <div id="drophint">Drop PDF statements to parse</div>
    <div class="panel">
      <div class="panel-head"><span class="k">PDF</span> Document</div>
      <div class="panel-body" id="doc"><div class="placeholder">Upload a PDF to begin.</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="k">{ }</span> Live output</div>
      <div class="panel-body"><pre id="source"><div class="placeholder">Markdown will appear here.</div></pre></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="k">HTML</span> Rendered</div>
      <div class="panel-body"><iframe id="rendered"></iframe></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="k">UW</span> Analysis</div>
      <div class="panel-body" id="analysis"><div class="analysis-empty">Analysis will appear here.</div></div>
    </div>
  </div>

  <script src="/static/app.js?v=analysis-4panel"></script>
</body>
</html>
